<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          
            background: linear-gradient(135deg, #fce9f1 0%, #f1e7fe 100%);
            color: #333;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 25px;
        }
        h1 {
            width: 100%;
            text-align: center;
            color: #1c1e21;
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 20px;
        }
        fieldset {
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
            flex-basis: 280px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        fieldset:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .container fieldset:nth-child(2) {
            margin-top: 60px;
        }
        .container fieldset:nth-child(3) {
            margin-top: 120px;
        }
        legend {
            font-size: 1.3em;
            font-weight: 600;
            color: #7B2CBF; 
            padding: 0 5px;
            margin-left: -5px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            background-color: #7B2CBF; 
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        input[type="submit"][value="Listar"] {
            background-color: transparent;
            color: #5a626b;
            border-color: #ced4da;
        }
        input[type="submit"]:not([value="Listar"]):hover {
            background-color: #5a1e96;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.3);
            transform: translateY(-2px);
        }
        input[type="submit"][value="Listar"]:hover {
            background-color: #6c757d;
            color: white;
            border-color: #6c757d;
        }
    </style>
</head>
<body>

    <div class="container">
        <fieldset>
            <legend>Gerenciar Versao</legend>
            <form action='/femaservlet/cadastrarVersao' method="get">
                <input type='submit' value='Cadastrar' name="operacao">
                <input type='submit' value='Listar' name="operacao">
            </form>
        </fieldset>

        <fieldset>
            <legend>Gerenciar Marca</legend>
            <form action='/femaservlet/cadastrarMarca' method="get">
                <input type='submit' value='Cadastrar' name="operacao">
                <input type='submit' value='Listar' name="operacao">
            </form>
        </fieldset>

        <fieldset>
            <legend>Gerenciar Modelo</legend>
            <form action='/femaservlet/cadastrarModelo' method="get">
                <input type='submit' value='Cadastrar' name="operacao">
                <input type='submit' value='Listar' name="operacao">
            </form>
        </fieldset>
        
    </div>

</body>
</html>
